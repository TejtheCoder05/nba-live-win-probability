name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and frozen model
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU-only PyTorch and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          python -m pip install -r requirements.txt

      - name: Verify frozen model integrity
        run: python scripts/verify_model_artifact.py

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q src scripts

      - name: Check dependency integrity
        run: python -m pip check

      - name: Check patch whitespace
        run: git diff --check

  docker:
    name: Production Docker image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build production image
        run: docker build --tag nba-win-probability:ci .

      - name: Confirm image metadata
        run: |
          docker image inspect nba-win-probability:ci --format 'size={{.Size}} user={{.Config.User}}'
          test "$(docker image inspect nba-win-probability:ci --format '{{.Config.User}}')" = "app"

      - name: Verify production container and WebSocket replay
        run: python scripts/verify_container.py --image nba-win-probability:ci
